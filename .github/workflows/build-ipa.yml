name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LidarSkaner.xcodeproj \
            -scheme LidarSkaner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LidarSkaner.app Payload/
          zip -qry LidarSkaner.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LidarSkaner-ipa
          path: LidarSkaner.ipa
          retention-days: 30

      # Stały, publiczny link: https://github.com/<user>/<repo>/releases/download/latest/LidarSkaner.ipa
      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LidarSkaner.ipa \
            --title "LidarSkaner – najnowsza wersja" \
            --notes "Zbudowano z commita ${{ github.sha }}" \
            --target ${{ github.sha }}
