# Definicja projektu dla XcodeGen – plik .xcodeproj generuje się w chmurze (GitHub Actions),
# więc do pracy nie jest potrzebny Mac.
name: LidarSkaner
options:
  bundleIdPrefix: pl.lidarskaner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  LidarSkaner:
    type: application
    platform: iOS
    sources:
      - LidarApp
    scheme: {}
    info:
      path: LidarApp/Info.plist
      properties:
        CFBundleDisplayName: LiDAR Skaner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Aparat i skaner LiDAR są potrzebne do skanowania, pomiarów i zdjęć punktów.
        NSLocationWhenInUseUsageDescription: Lokalizacja GPS jest potrzebna do nadania współrzędnych PL-2000 punktom inwentaryzacji.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.autodesk.dxf
            UTTypeDescription: Rysunek DXF
            UTTypeConformsTo: [public.data, public.text]
            UTTypeTagSpecification:
              public.filename-extension: [dxf, DXF]
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.lidarskaner.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
